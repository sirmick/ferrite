[package]
name        = "ferrite-analysis"
version     = "0.9.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite analysis toolkit — spectrum, spectrogram, envelope over recorded IQ (pure Rust, wasm-clean)."

[lints]
workspace = true

[dependencies]
anyhow      = "1"
num-complex = { version = "0.4", default-features = false, features = ["std"] }
rustfft     = { version = "6", default-features = false }
serde       = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
