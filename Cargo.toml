[workspace]
resolver = "2"
members = [
    "server",
    "blocks",
    "blocks-macros",
    "blocks/native/hello",
    "blocks/native/liquid-dsp",
    "blocks/native/multimon-ng",
    "blocks/native/dump1090",
    "blocks/native/rtl-ais",
    "runtime",
]

[workspace.package]
edition      = "2021"
rust-version = "1.89"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/sirmick/ferrite"
authors      = ["Mick <sirmick@gmail.com>"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic          = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc     = "allow"
missing_panics_doc     = "allow"
# `!(x > 0.0)` is intentional NaN-safe guard. The "use partial_cmp"
# alternative is harder to read and equivalent in practice — every
# call site is a "reject zero / negative / NaN" check.
neg_cmp_op_on_partial_ord = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1
