# wasm32 link tuning for the browser runtime/blocks build.
#
# The vendored wsprd `wspr_decode` keeps large 2-D float work arrays on
# the C stack (spectrogram-sized). wasm-ld's default shadow stack is
# 1 MiB, which those locals overflow — manifesting as a runtime
# "memory access out of bounds" deep in `decode_window` (proven by the
# browser-path WSPR e2e). Reserve a larger stack; wasm linear memory
# still grows on demand, this only sizes the stack region. wasm32-only,
# so native builds/tests are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-arg=-zstack-size=8388608"]
