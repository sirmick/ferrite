[package]
name        = "ferrite-runtime"
version     = "0.9.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite flowgraph runtime — doc parser, scheduler, lifecycle. Dual-compile (native + WebAssembly)."

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# `wasm` includes `multimon` so the browser-side runtime carries the
# multimon-ng-backed decoders (Pager / Packet / Eas / Morse / DTMF
# multimon variant). Lets presets place those blocks on the browser
# side, which removes the need for a node↔browser audio bridge in
# decoder presets that don't otherwise need anything node-only.
# `fldigi` registers the vendored fldigi modems (RttyDemod / Psk31Demod
# / … ) in the browser runtime; on wasm32 their C ABI is satisfied by
# the sibling Emscripten module via the wasm-bindgen snippet (see
# web/src/lib/wasm/fldigi/fldigiBridge.ts + initFldigiBridge wiring).
wasm    = [
    "dep:wasm-bindgen",
    "ferrite-blocks/multimon",
    "ferrite-blocks/rtl_433",
    "ferrite-blocks/fldigi",
]

[dependencies]
anyhow         = "1"
ferrite-blocks = { path = "../blocks", version     = "0.9.0" }
num-complex    = { version = "0.4", default-features = false, features = ["std"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "2"
wasm-bindgen   = { version = "0.2", optional = true }
# Drop-in `std::time::Instant` shim that uses `performance.now()` on
# wasm32. Lets the runtime time `process()` calls on the browser side
# the same way it does on native — `Instant::now()` from std panics on
# wasm32-unknown-unknown.
web-time       = "1"

# wasm-pack downloads a prebuilt `wasm-opt` (binaryen) to optimize the
# emitted .wasm. Upstream binaries only exist for x86_64 / aarch64 hosts;
# riscv64 (and other less-common Rust targets) need this disabled or the
# build fails with "Unrecognized target!". Skipping wasm-opt makes the
# bundle ~30% larger but otherwise has no functional effect.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
