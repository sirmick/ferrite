[package]
name        = "ferrite-runtime"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite flowgraph runtime — doc parser, scheduler, lifecycle. Dual-compile (native + WebAssembly)."

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm    = ["dep:wasm-bindgen"]

[dependencies]
anyhow         = "1"
ferrite-blocks = { path = "../blocks", version = "0.0.1" }
num-complex    = { version = "0.4", default-features = false, features = ["std"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
thiserror      = "2"
wasm-bindgen   = { version = "0.2", optional = true }

[dev-dependencies]
