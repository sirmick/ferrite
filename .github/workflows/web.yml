name: pnpm

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pnpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain (wasm32 target for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm cross-compile deps
        # vendored multimon-ng + ft8_lib cross-compile to wasm32 via
        # clang against wasi-libc — same recipe as a local build.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wasi-libc

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install Emscripten
        # `wasm:build` includes `wasm:build:fldigi`, which compiles the
        # curated fldigi C++ to a sibling Emscripten module
        # (web/src/lib/wasm/fldigi/fldigi.{mjs,wasm}) for the in-browser
        # fldigi bridge. build.sh is emcc-gated and no-ops without it;
        # install emsdk so CI actually produces the artifact (svelte-
        # check + the browser-path fldigi e2e need it). Pinned to the
        # dev-box emcc version for reproducibility; cached by the action.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      - name: Vendor whisper.cpp (pinned)
        # `wasm:build:whisper` is inert until whisper.cpp is vendored,
        # which leaves the whisper golden e2e green-by-skip. Vendor the
        # pinned commit (see blocks/native/whisper/README.md) so the
        # Emscripten whisper module is actually built and that e2e
        # becomes a hard gate. Exact-commit fetch, not a --depth 1
        # clone, so the pin can't drift.
        run: |
          PIN=968eebe77225d25e57a3f981da7c696310f0e881
          mkdir -p blocks/native/whisper/vendor/whisper.cpp
          cd blocks/native/whisper/vendor/whisper.cpp
          git init -q
          git remote add origin https://github.com/ggml-org/whisper.cpp
          git fetch -q --depth 1 origin "$PIN"
          git checkout -q FETCH_HEAD

      - name: Fetch whisper tiny model
        # The golden e2e (whisperGoldenE2E.test.ts) transcribes through
        # the built module against ggml-tiny.en-q5_1 (~30 MB — chosen
        # small enough for the fast lane).
        run: |
          mkdir -p web/static/models
          curl -fL --retry 3 --retry-delay 5 \
            -o web/static/models/ggml-tiny.en-q5_1.bin \
            https://huggingface.co/ggml-org/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build wasm artifacts
        # `pnpm -r check` (svelte-check) imports from
        # web/src/lib/wasm/{blocks,runtime}; both are produced by
        # wasm-pack. `wasm:build:fldigi` emits the Emscripten fldigi
        # bridge and `wasm:build:whisper` the whisper module (emsdk +
        # vendored sources above). Build all before lint / check / test.
        run: pnpm --filter @ferrite/web wasm:build

      - name: pnpm -r lint
        run: pnpm -r lint

      - name: pnpm -r check
        run: pnpm -r check

      - name: pnpm test (web only)
        # The `tools/screenshot` package's Playwright e2e suite needs a
        # release ferrited binary + libSoapySDR + Chromium — too heavy
        # for the fast pnpm CI. Run those locally / from rust.yml when
        # we want them, not on every push.
        run: pnpm --filter @ferrite/web test
