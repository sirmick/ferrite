name: pnpm

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pnpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain (wasm32 target for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm cross-compile deps + espeak-ng
        # vendored multimon-ng + ft8_lib cross-compile to wasm32 via
        # clang against wasi-libc — same recipe as a local build.
        # espeak-ng feeds the TTS → sherpa round-trip e2e (synthesised
        # speech through the real browser STT module); without it that
        # layer skips.
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wasi-libc espeak-ng

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install Emscripten
        # `wasm:build` includes `wasm:build:fldigi`, which compiles the
        # curated fldigi C++ to a sibling Emscripten module
        # (web/src/lib/wasm/fldigi/fldigi.{mjs,wasm}) for the in-browser
        # fldigi bridge. build.sh is emcc-gated and no-ops without it;
        # install emsdk so CI actually produces the artifact (svelte-
        # check + the browser-path fldigi e2e need it). Pinned to the
        # dev-box emcc version for reproducibility; cached by the action.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      # --- In-browser speech-to-text: sherpa-onnx (replaced whisper.cpp) ---
      # `wasm:build:sherpa` is inert until the source is vendored, the
      # model is present and emsdk is on PATH — which leaves the sherpa
      # golden e2e green-by-skip. Provide all three so the module is
      # really built and the "Artifacts present" step below makes the
      # transcript gate hard. Pins mirror scripts/bootstrap.sh
      # (SHERPA_PIN / SHERPA_MODEL_URL) and blocks/native/sherpa/README.md.
      - name: Cache sherpa-onnx source + wasm build tree
        id: sherpa-src
        uses: actions/cache@v4
        with:
          # Source *and* the out-of-tree build dir live here, so a hit
          # skips the clone and makes the Emscripten build incremental
          # (~3 min cold: onnxruntime is prebuilt, only sherpa compiles).
          path: blocks/native/sherpa/vendor/sherpa-onnx
          key: sherpa-onnx-v1.13.2-emsdk5.0.7-${{ hashFiles('blocks/native/sherpa/emscripten/build.sh') }}

      - name: Vendor sherpa-onnx (pinned tag)
        if: steps.sherpa-src.outputs.cache-hit != 'true'
        run: |
          PIN=v1.13.2
          DIR=blocks/native/sherpa/vendor/sherpa-onnx
          mkdir -p "$DIR"
          git -C "$DIR" init -q
          git -C "$DIR" remote add origin https://github.com/k2-fsa/sherpa-onnx
          git -C "$DIR" fetch -q --depth 1 origin "refs/tags/$PIN:refs/tags/$PIN"
          git -C "$DIR" checkout -q --detach "$PIN"

      - name: Cache sherpa EN-20M model
        id: sherpa-model
        uses: actions/cache@v4
        with:
          path: tools/sherpa-asr/models/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17
          key: sherpa-model-streaming-zipformer-en-20M-2023-02-17

      - name: Fetch sherpa EN-20M model
        if: steps.sherpa-model.outputs.cache-hit != 'true'
        # GitHub release CDN (no HuggingFace rate-limit); ~42 MB int8.
        run: |
          mkdir -p tools/sherpa-asr/models
          curl -fL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
            -o /tmp/sherpa-model.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17.tar.bz2
          tar xjf /tmp/sherpa-model.tar.bz2 -C tools/sherpa-asr/models

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Build wasm artifacts
        # `pnpm -r check` (svelte-check) imports from
        # web/src/lib/wasm/{blocks,runtime}; both are produced by
        # wasm-pack. `wasm:build:fldigi` emits the Emscripten fldigi
        # bridge and `wasm:build:sherpa` the speech-to-text module
        # (emsdk + vendored sources above). Build all before lint /
        # check / test.
        run: pnpm --filter @ferrite/web wasm:build

      - name: Artifacts present (hard gate)
        # The Emscripten builds exit 0 when their inputs are missing so a
        # dev box degrades gracefully — CI must not. If any of these is
        # absent the matching e2e would silently `skipIf`.
        run: |
          set -e
          for f in web/src/lib/wasm/blocks/ferrite_blocks_bg.wasm \
                   web/src/lib/wasm/runtime/runtime_bg.wasm \
                   web/src/lib/wasm/fldigi/fldigi.wasm \
                   web/src/lib/wasm/sherpa/sherpa-onnx-wasm-main-asr.wasm \
                   web/src/lib/wasm/sherpa/sherpa-onnx-wasm-main-asr.data \
                   web/src/lib/wasm/sherpa/sherpa-onnx-asr.js; do
            [ -s "$f" ] || { echo "::error::missing wasm artifact: $f"; exit 1; }
          done

      - name: pnpm -r lint
        run: pnpm -r lint

      - name: pnpm -r check
        run: pnpm -r check

      - name: pnpm test (web only)
        # The `tools/screenshot` package's Playwright e2e suite needs a
        # release ferrited binary + libSoapySDR + Chromium — too heavy
        # for the fast pnpm CI. Run those locally / from rust.yml when
        # we want them, not on every push.
        run: pnpm --filter @ferrite/web test
