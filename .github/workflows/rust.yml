name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        # libsoapysdr-dev: ferrited + the `soapysdr` feature on
        # ferrite-blocks link against libSoapySDR via pkg-config.
        # clang / lld / wasi-libc: vendored multimon-ng + ft8_lib
        # cross-compile to wasm32 via clang, link against wasi-libc's
        # libc.a — needed for the `cargo check (wasm32)` step below.
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoapysdr-dev clang lld wasi-libc cmake

      - name: Vendor whisper.cpp (pinned — native wsp_* FFI link)
        # ferrite-whisper's build.rs builds whisper.cpp via its own CMake to
        # resolve the `wsp_*` C ABI. Without the vendored source it emits a
        # stub, and once a block references the engine (node-side STT)
        # `cargo test` fails to link (undefined `wsp_transcribe`/…). Pin
        # matches scripts/bootstrap.sh — the local build's source of truth.
        run: |
          PIN=v1.8.6
          DIR=blocks/native/whisper/vendor/whisper.cpp
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q
          git remote add origin https://github.com/ggml-org/whisper.cpp
          git fetch -q --depth 1 origin "$PIN"
          git checkout -q FETCH_HEAD

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Workspace sets `pedantic = warn` in Cargo.toml as guidance for
        # devs; CI denies the default lint set but keeps pedantic
        # informational (avoids new pedantic lints in stable Rust
        # breaking CI overnight).
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::pedantic

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo check (wasm32)
        run: cargo check -p ferrite-blocks --target wasm32-unknown-unknown --features wasm
