[package]
name        = "ferrited"
version     = "0.9.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite SDR daemon — device I/O, wideband FFT, channelizer, WS transport."

[lints]
workspace = true

# SoapySDR is a hard requirement for ferrited — `libSoapySDR` and its
# pkg-config metadata must be on `PKG_CONFIG_PATH` at build time (see
# scripts/build-soapysdr.sh and the `source soapysdr/env.sh` line in
# docs/06-build.md). Making it required (not a feature) avoids the
# silent-degradation footgun where a soapy-less build would pretend
# every device was unavailable at runtime.

[dependencies]
axum        = { version = "0.7", features = ["macros", "ws"] }
tokio       = { version = "1", features = ["full"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
http        = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
ferrite-blocks = { path = "../blocks", features = ["soapysdr", "multimon", "adsb", "ais", "ft8", "wspr", "rtl_433"] }
ferrite-runtime = { path = "../runtime" }
num-complex = { version = "0.4", default-features = false, features = ["std"] }
postcard    = { version = "1", default-features = false, features = ["alloc"] }
soapysdr    = "0.5"
# Used directly to reach SoapySDRDevice_getSettingInfo / writeSetting,
# which the safe `soapysdr` 0.5 wrapper doesn't yet expose. Same Soapy
# C-ABI; no separate `soapysdr-sys = ...` is needed for the safe crate.
soapysdr-sys = "0.8"
# Used by the /ws/chat reverse-proxy that fronts the ferrite-ai sidecar
# so the browser only ever talks to ferrited's port. Sidecar URL
# defaults to `ws://127.0.0.1:10002/ws/chat`; override with FERRITE_AI_URL.
tokio-tungstenite = "0.24"
futures-util      = "0.3"
# Used by `view_bridge.rs` to decode base64 PNGs the browser sends in
# response to `GET /api/ui-views/:pane` snapshot requests.
base64            = "0.22"
thiserror         = "1"

[dev-dependencies]
tempfile          = "3"
