[package]
name        = "ferrited"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite SDR daemon — device I/O, wideband FFT, channelizer, WS transport."

[lints]
workspace = true

[features]
default  = []
# Links SoapySDR at build time. Requires libSoapySDR and its pkg-config
# metadata on PKG_CONFIG_PATH — see scripts/build-soapysdr.sh and the
# `source soapysdr/env.sh` line in docs/06-build.md. Propagates to the
# blocks crate so the `SoapySource` flowgraph block appears in the
# registry whenever the server has Soapy linked in.
soapysdr = ["dep:soapysdr", "ferrite-blocks/soapysdr"]

[dependencies]
axum        = { version = "0.7", features = ["macros", "ws"] }
tokio       = { version = "1", features = ["full"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "cors", "fs", "set-header"] }
http        = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
ferrite-blocks = { path = "../blocks" }
ferrite-runtime = { path = "../runtime" }
num-complex = { version = "0.4", default-features = false, features = ["std"] }
postcard    = { version = "1", default-features = false, features = ["alloc"] }
soapysdr    = { version = "0.5", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util      = "0.3"
tempfile          = "3"
