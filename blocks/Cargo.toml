[package]
name        = "ferrite-blocks"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite DSP blocks — dual-compile Rust crate (native + WebAssembly)."

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm    = ["dep:wasm-bindgen"]

[dependencies]
anyhow                = "1"
ferrite-blocks-macros = { path = "../blocks-macros", version = "0.0.1" }
inventory             = "0.3"
num-complex           = { version = "0.4", default-features = false, features = ["std"] }
rustfft               = { version = "6", default-features = false }
wasm-bindgen          = { version = "0.2", optional = true }
