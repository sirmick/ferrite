[package]
name        = "ferrite-blocks"
version     = "0.9.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite DSP blocks — dual-compile Rust crate (native + WebAssembly)."

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default  = []
# `wasm` enables the wasm-bindgen surface AND multimon + rtl_433.
# Pulling them through here lets wasm-pack on this crate compile the
# decoder blocks into the browser bundle the same way the runtime
# crate does.
wasm     = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde_bytes", "dep:js-sys", "multimon", "ft8", "wspr", "rtl_433", "ais"]
# Links libSoapySDR; enables the `SoapySource` block. Native only —
# blocks with this feature panic at monomorphization on wasm32.
soapysdr = ["dep:soapysdr"]
# Links vendored multimon-ng; enables digital-mode decoder blocks
# (PagerDemod et al). Builds for both native and wasm32 — the C
# vendor compiles cleanly through libc-stubs + wasi-libc on wasm32,
# letting the multimon decoder blocks run on the browser side.
multimon = ["dep:ferrite-multimon-ng"]
# Links vendored dump1090; enables `AdsbDemod` (Mode S / ADS-B at
# 1090 MHz). Native only — same constraint as multimon.
adsb     = ["dep:ferrite-dump1090"]
# Links vendored aisdecoder (from rtl-ais); enables `AisDemod` (marine
# AIS at 161.975 + 162.025 MHz). Dual-compile (native + wasm32 via
# libc-stubs + wasi-libc) — runs browser-side like the other decoders.
ais      = ["dep:ferrite-rtl-ais"]
# Links vendored ft8_lib; enables `Ft8Demod` (FT8 / FT4 weak-signal
# digital modes — 14.074 / 7.074 / 3.573 MHz USB). Native only — the
# decoder's LDPC + Costas-sync hot path expects libc/libm.
ft8      = ["dep:ferrite-ft8"]
# Links vendored rtl_433 (~320 ISM-band device decoders, 315/433.92/
# 868/915 MHz). Dual-compile (native + wasm32 via libc-stubs + wasi-
# libc). Big bundle (~4 MB wasm) — runs server-side by default with
# the WsBridge auto-inserted; users can opt to run browser-side via
# `placement: "browser"` on the preset.
rtl_433  = ["dep:ferrite-rtl-433"]
# Links vendored wsprd (WSPR decoder, GPL-3.0). Dual-compile (native +
# wasm32) — its lone FFTW dependency is shimmed to the same kiss_fft
# ft8_lib uses, so `WsprDemod` is Placement::Either like `Ft8Demod`.
wspr     = ["dep:ferrite-wsprd"]
# Curated fldigi modem cores (PSK/RTTY/MFSK/Olivia/… , GPL-3.0).
# Native: static C++ link. wasm: ABI as imports → sibling Emscripten
# module (link-vs-bridge). Not in `wasm` until Phase 0e proves the
# bridge; not in `default` until Phase 0d lands a green golden test.
fldigi   = ["dep:ferrite-fldigi"]

[dependencies]
anyhow                = "1"
ferrite-blocks-macros = { path = "../blocks-macros", version     = "0.9.0" }
# Drop-in `SystemTime` that works on wasm32 (JS clock) as well as
# native (re-exports std). Used by the slot-aligned ft8/wspr decoders
# so they run browser-side; `std::time::SystemTime::now()` panics on
# wasm32-unknown-unknown. Same crate runtime/ already uses.
web-time              = "1"
ferrite-liquid-dsp    = { path = "native/liquid-dsp", version     = "0.9.0" }
ferrite-multimon-ng   = { path = "native/multimon-ng", version     = "0.9.0", optional = true }
ferrite-dump1090      = { path = "native/dump1090",    version     = "0.9.0", optional = true }
ferrite-rtl-ais       = { path = "native/rtl-ais",     version     = "0.9.0", optional = true }
ferrite-ft8           = { path = "native/ft8",         version     = "0.9.0", optional = true }
ferrite-wsprd         = { path = "native/wsprd",       version     = "0.9.0", optional = true }
ferrite-fldigi        = { path = "native/fldigi",      version     = "0.9.0", optional = true }
ferrite-rtl-433       = { path = "native/rtl_433",     version     = "0.9.0", optional = true }
inventory             = "0.3"
# Pure-Rust port of Xiph RNNoise. No C deps, wasm32-clean, ~50 kB with
# embedded GRU weights. Used by audio_nr::neural. DeepFilterNet3 via
# tract-onnx is the V2 upgrade path once wasm-perf is measured.
nnnoiseless           = { version = "0.5", default-features = false }
num-complex           = { version = "0.4", default-features = false, features = ["std"] }
postcard              = { version = "1", default-features = false, features = ["alloc"] }
rustfft               = { version = "6", default-features = false }
serde                 = { version = "1", features = ["derive"] }
serde_bytes           = { version = "0.11", optional = true }
serde_json            = "1"
serde-wasm-bindgen    = { version = "0.6", optional = true }
js-sys                = { version = "0.3", optional = true }
soapysdr              = { version = "0.5", optional = true }
tracing               = "0.1"
wasm-bindgen          = { version = "0.2", optional = true }

# See note in runtime/Cargo.toml — wasm-pack's prebuilt wasm-opt binaries
# only target x86_64 / aarch64; disable for cross-host portability.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
# Used by integration tests that want to capture lines a block emits via
# `tracing::info!(target: "decoder::…", …)` without a global subscriber.
tracing-subscriber    = { version = "0.3", default-features = false, features = ["fmt"] }
