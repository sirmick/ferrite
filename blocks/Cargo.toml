[package]
name        = "ferrite-blocks"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite DSP blocks — dual-compile Rust crate (native + WebAssembly)."

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default  = []
wasm     = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde_bytes", "dep:js-sys"]
# Links libSoapySDR; enables the `SoapySource` block. Native only —
# blocks with this feature panic at monomorphization on wasm32.
soapysdr = ["dep:soapysdr"]

[dependencies]
anyhow                = "1"
ferrite-blocks-macros = { path = "../blocks-macros", version = "0.0.1" }
ferrite-liquid-dsp    = { path = "native/liquid-dsp", version = "0.0.1" }
inventory             = "0.3"
# Pure-Rust port of Xiph RNNoise. No C deps, wasm32-clean, ~50 kB with
# embedded GRU weights. Used by audio_nr::neural. DeepFilterNet3 via
# tract-onnx is the V2 upgrade path once wasm-perf is measured.
nnnoiseless           = { version = "0.5", default-features = false }
num-complex           = { version = "0.4", default-features = false, features = ["std"] }
postcard              = { version = "1", default-features = false, features = ["alloc"] }
rustfft               = { version = "6", default-features = false }
serde                 = { version = "1", features = ["derive"] }
serde_bytes           = { version = "0.11", optional = true }
serde_json            = "1"
serde-wasm-bindgen    = { version = "0.6", optional = true }
js-sys                = { version = "0.3", optional = true }
soapysdr              = { version = "0.5", optional = true }
tracing               = "0.1"
wasm-bindgen          = { version = "0.2", optional = true }
