[package]
name        = "ferrite-blocks"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrite DSP blocks — dual-compile Rust crate (native + WebAssembly)."

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default  = []
wasm     = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:serde_bytes", "dep:js-sys"]
# Links libSoapySDR; enables the `SoapySource` block. Native only —
# blocks with this feature panic at monomorphization on wasm32.
soapysdr = ["dep:soapysdr"]
# Links vendored multimon-ng; enables digital-mode decoder blocks
# (PagerDemod et al). Native only — multimon-ng is a C library.
multimon = ["dep:ferrite-multimon-ng"]
# Links vendored dump1090; enables `AdsbDemod` (Mode S / ADS-B at
# 1090 MHz). Native only — same constraint as multimon.
adsb     = ["dep:ferrite-dump1090"]
# Links vendored aisdecoder (from rtl-ais); enables `AisDemod` (marine
# AIS at 161.975 + 162.025 MHz). Native only.
ais      = ["dep:ferrite-rtl-ais"]

[dependencies]
anyhow                = "1"
ferrite-blocks-macros = { path = "../blocks-macros", version = "0.0.1" }
ferrite-liquid-dsp    = { path = "native/liquid-dsp", version = "0.0.1" }
ferrite-multimon-ng   = { path = "native/multimon-ng", version = "0.0.1", optional = true }
ferrite-dump1090      = { path = "native/dump1090",    version = "0.0.1", optional = true }
ferrite-rtl-ais       = { path = "native/rtl-ais",     version = "0.0.1", optional = true }
inventory             = "0.3"
# Pure-Rust port of Xiph RNNoise. No C deps, wasm32-clean, ~50 kB with
# embedded GRU weights. Used by audio_nr::neural. DeepFilterNet3 via
# tract-onnx is the V2 upgrade path once wasm-perf is measured.
nnnoiseless           = { version = "0.5", default-features = false }
num-complex           = { version = "0.4", default-features = false, features = ["std"] }
postcard              = { version = "1", default-features = false, features = ["alloc"] }
rustfft               = { version = "6", default-features = false }
serde                 = { version = "1", features = ["derive"] }
serde_bytes           = { version = "0.11", optional = true }
serde_json            = "1"
serde-wasm-bindgen    = { version = "0.6", optional = true }
js-sys                = { version = "0.3", optional = true }
soapysdr              = { version = "0.5", optional = true }
tracing               = "0.1"
wasm-bindgen          = { version = "0.2", optional = true }

[dev-dependencies]
# Used by integration tests that want to capture lines a block emits via
# `tracing::info!(target: "decoder::…", …)` without a global subscriber.
tracing-subscriber    = { version = "0.3", default-features = false, features = ["fmt"] }
