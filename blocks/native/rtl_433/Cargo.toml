[package]
name        = "ferrite-rtl-433"
version     = "0.9.0"
edition.workspace      = true
rust-version.workspace = true
# rtl_433 is GPL-2-or-later. The shim + Rust wrapper here are GPL-3-or-later
# under the project's overall license. GPL-2+ → GPL-3+ is compatible (we add
# restrictions, do not remove them).
license     = "GPL-3.0-or-later"
repository.workspace   = true
authors.workspace      = true
publish     = false
description = "Vendored rtl_433 (~320 ISM-band device decoders, 315/433.92/868/915 MHz) + safe Rust wrapper. Dual-compile (native + WASM) following the multimon-ng / dump1090 pattern."

[lib]
crate-type = ["rlib"]

[dependencies]
num-complex = "0.4"

[build-dependencies]
cc      = "1.0"
bindgen = "0.70"
