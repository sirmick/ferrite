[package]
name        = "ferrite-multimon-ng"
version     = "0.0.1"
edition.workspace      = true
rust-version.workspace = true
license     = "GPL-3.0-or-later"
repository.workspace   = true
authors.workspace      = true
publish     = false
description = "Vendored multimon-ng + safe Rust wrappers for digital-mode decoders. Native-only (the demods aren't intended for the wasm runtime)."

[lib]
crate-type = ["rlib"]

# Diagnostic CLI — point at a 22050 Hz mono WAV captured from a real
# carrier (or a `gen_pocsag` synthesis), prints any decoded POCSAG
# messages plus burst statistics. Useful for offline triage when a
# live preset isn't surfacing decodes.
[[bin]]
name = "analyze-pocsag-wav"
path = "src/bin/analyze_pocsag_wav.rs"

[build-dependencies]
cc      = "1.0"
bindgen = "0.70"
