[package]
name        = "ferrite-mbelib"
version     = "0.9.0"
edition.workspace      = true
rust-version.workspace = true
# mbelib is ISC-licensed (vendor/COPYRIGHT) — GPL-compatible. Its README
# carries a patent notice for compiled AMBE/IMBE decoders; see
# vendor/README.md and the top-level README.
license     = "ISC"
repository.workspace   = true
authors.workspace      = true
publish     = false
description = "mbelib AMBE+2 / IMBE voice synthesis behind a narrow C ABI. Native: static C link. wasm32: ABI as wasm-bindgen imports, satisfied by a lazily loaded sibling Emscripten module (the fldigi link-vs-bridge pattern)."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[build-dependencies]
cc = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
